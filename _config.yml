name: "Dhillon Lab"
description: "The Dhillon Lab in the Division of Food, Nutrition & Exercise Sciences at the University of Missouri studies whole-food, dietary pattern, and lifestyle interventions, the gut microbiome and omics, and the contextual factors that shape cardiometabolic responses to diet."

url: "https://lab.drjaapnadhillon.com"

# Visual style: the file name of a TypeUI style in /static/css/styles/ (for example editorial, minimal, terracotta).
style: editorial-teal

paginate: 10
plugins: [jekyll-paginate]
paginate_path: "news/page:num"

permalink: pretty
markdown: kramdown
kramdown:
  parse_block_html: true

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
  - LICENSE

collections:
  members:
    output: false
  publications:
    output: false

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      group: news
      author: Jaapna Dhillon
