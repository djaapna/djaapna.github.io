<!DOCTYPE html>
<html lang="en">
<head>
{% include head.html %}
</head>
<body>
{% include header.html %}
{% if page.title and page.hide_title != true %}{% assign banner = site.data.banners[page.group] %}
<div class="page-band{% if banner %} has-image{% endif %}"{% if banner %} style="background-image: url('{{ banner }}')"{% endif %}>
  <div class="container"><h1 class="page-title">{{ page.heading | default: page.title }}</h1></div>
</div>
{% endif %}
<main id="main" class="container page">
{{ content }}
</main>
{% include footer.html %}
</body>
</html>
