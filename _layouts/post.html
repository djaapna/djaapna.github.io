---
layout: default
hide_title: true
---
<article class="post">
  <p class="eyebrow"><a href="/news/">News</a> · {% if page.date_label %}{{ page.date_label }}{% else %}{{ page.date | date: "%B %Y" }}{% endif %}</p>
  <h1 class="page-title">{{ page.title | markdownify | remove: '<p>' | remove: '</p>' | strip }}</h1>
  <div class="prose">
    {{ content }}
  </div>
  <p class="back-link"><a href="/news/">All news</a></p>
</article>
