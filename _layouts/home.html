<!DOCTYPE html>
<html lang="en">
<head>
{% include head.html %}
</head>
<body>
{% include header.html %}
{% assign banner = site.data.banners[page.group] %}
<div class="page-band hero{% if banner %} has-image{% endif %}"{% if banner %} style="background-image: url('{{ banner }}')"{% endif %}>
  <div class="container"><h1 class="home-title">{{ page.heading }}</h1></div>
</div>
<main id="main" class="container page home">
  <div class="home-grid">
    <div class="home-main">
      {{ content }}
    </div>
    <aside class="home-side">
      {% include sidebar.html %}
    </aside>
  </div>
</main>
{% include footer.html %}
</body>
</html>
