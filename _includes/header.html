<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/">
      <span class="brand-name">{{ site.name }}</span>
      <span class="brand-sub">{{ site.data.lab.division }}</span>
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Open menu">
    <label for="nav-toggle" class="nav-toggle-label" aria-hidden="true"><span></span><span></span><span></span></label>
    <nav class="site-nav" aria-label="Main">
      <ul>
        {% for link in site.data.navlinks %}
        <li><a href="{{ link.link }}"{% if page.group == link.group %} aria-current="page"{% endif %}>{{ link.name }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
